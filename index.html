<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky brand bar (text size · centered wordmark · language) with Chrome-style tabs; each tab is its own page.
   Calculator = welcome card, inputs, layered result (headline → alerts → plan → expert details) */
:root{
  --deep:#00167a;--royal:#075BFF;--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--mute:#56657c;--line:#d9e2ee;--soft:#eef4ff;
  --ok:#0f7a4f;--ok-bg:#e6f6ee;--warn:#9a5b00;--warn-bg:#fff4dd;--bad:#b42318;--bad-bg:#fdecea;--chip:#e3ecff;--sel:#00167a;
  --hdr:#ffffff;--strip:#e7eef0;--hfg:#33434d;--hpill:#eef2f4;--hsel:#0B6B6E;--hselfg:#fff;--wm1:#0B6B6E;--wm2:#8E1B54;--tile:#ffffff;
  --f-display:Cairo,"Segoe UI",Tahoma,sans-serif;--f-body:Tajawal,Cairo,"Segoe UI",Tahoma,sans-serif;--z:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --hdr:#0c1820;--strip:#0f1f29;--hfg:#b8c7cf;--hpill:#1a2c37;--hsel:#3fb6b1;--hselfg:#06232a;--wm1:#6fd3cf;--wm2:#f48fbc;--tile:#ffffff;
  --royal:#7aa9ff;--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--mute:#9caac0;--line:#27344e;--soft:#172540;
  --ok:#5fd3a0;--ok-bg:#12302a;--warn:#f2b955;--warn-bg:#33270f;--bad:#ff8a80;--bad-bg:#3a1a1a;--chip:#1d2b4a;--sel:#2b4cc4;color-scheme:dark}}
:root[data-theme="dark"]{
  --hdr:#0c1820;--strip:#0f1f29;--hfg:#b8c7cf;--hpill:#1a2c37;--hsel:#3fb6b1;--hselfg:#06232a;--wm1:#6fd3cf;--wm2:#f48fbc;--tile:#ffffff;
  --royal:#7aa9ff;--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--mute:#9caac0;--line:#27344e;--soft:#172540;
  --ok:#5fd3a0;--ok-bg:#12302a;--warn:#f2b955;--warn-bg:#33270f;--bad:#ff8a80;--bad-bg:#3a1a1a;--chip:#1d2b4a;--sel:#2b4cc4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--hdr) 0,var(--hdr) 62%,var(--strip) 62%);color:var(--hfg);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,#0E8C8C,#8E1B54);opacity:.9}
.brand{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:12px 10px;max-width:1080px;margin:0 auto}
.logo{grid-column:2;margin:0;font:800 24px/1 var(--f-display);letter-spacing:.14em;display:flex;align-items:center;gap:8px;direction:ltr}
.logo .mk{width:40px;height:40px;border-radius:11px;background:var(--tile);display:grid;place-items:center;box-shadow:0 1px 2px rgba(15,40,50,.12),0 4px 12px rgba(14,140,140,.16);flex:none}
.logo .mk svg{width:31px;height:31px}
.logo .wm{font:800 24px/1 var(--f-display);letter-spacing:.1em;color:var(--wm1)}
.logo em{font-style:normal;color:var(--wm2)}
@media (max-width:420px){.logo{gap:6px}.logo .wm{font-size:19px;letter-spacing:.06em}.logo .mk{width:34px;height:34px}.logo .mk svg{width:26px;height:26px}.pill button{padding:4px 7px;min-width:30px}.pill .ico{padding:4px 6px;min-width:28px}}
.pill{display:flex;background:var(--hpill);border-radius:99px;padding:3px;gap:2px}
.pill button{border:0;background:transparent;color:var(--hfg);font:700 13px var(--f-body);padding:4px 10px;border-radius:99px;cursor:pointer;min-width:36px}
.pill button[aria-pressed="true"]{background:var(--hsel);color:var(--hselfg)}
.thm{grid-column:1;justify-self:start}
.thm button{display:grid;place-items:center}
.thm svg{width:16px;height:16px}
.lang{grid-column:3;justify-self:end}
.tabs{display:flex;align-items:flex-end;gap:2px;max-width:1080px;margin:0 auto;padding-top:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:1 1 0;min-width:max-content;max-width:230px;height:42px;padding:0 16px;border:0;border-radius:12px 12px 0 0;background:transparent;color:var(--hfg);font:700 14px var(--f-display);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .15s}
.tab svg{width:17px;height:17px;flex:none}
.tab:hover{background:color-mix(in srgb,var(--hfg) 9%,transparent)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab[aria-selected="true"]::before,.tab[aria-selected="true"]::after{content:"";position:absolute;bottom:0;width:12px;height:12px;pointer-events:none}
.tab[aria-selected="true"]::before{left:-12px;background:radial-gradient(circle at 0 0,transparent 11.5px,var(--bg) 12px)}
.tab[aria-selected="true"]::after{right:-12px;background:radial-gradient(circle at 100% 0,transparent 11.5px,var(--bg) 12px)}
.tab:first-child{margin-inline-start:12px}.tab:last-child{margin-inline-end:12px}
.tab .cnt{font:700 11px var(--f-body);background:var(--chip);color:var(--royal);border-radius:99px;padding:0 7px}
.tab:not([aria-selected="true"]) .cnt{background:var(--hpill);color:var(--hfg)}
@media (max-width:420px){.tab{padding:0 6px;gap:4px;font-size:12.5px;min-width:0}.tab>span:not(.new){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab .cnt{display:none}.tab svg{display:none}.tab:first-child{margin-inline-start:8px}.tab:last-child{margin-inline-end:8px}}
.tab .short{display:none}
@media (max-width:420px){.tab .full{display:none}.tab .short{display:inline}}
.tab .new{width:7px;height:7px;border-radius:50%;background:#ffb547;flex:none}
.tab[aria-selected="true"] .new{background:var(--warn)}
/* roadmap */
/* page colours: each tab has its own banner colour */
#calc{--pc:#0B6B6E;--pc2:#8E1B54}
#tools{--pc:#00167a;--pc2:#075BFF}
#interactions{--pc:#7a2e00;--pc2:#d9731f}
#sources{--pc:#0a4a2c;--pc2:#17915a}
#roadmap{--pc:#3a1678;--pc2:#7c4dff}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border:0;padding:20px 18px}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero .hi{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.hero .hi span{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.hero .hi svg{width:22px;height:22px}
.hero h2{color:#fff;margin:0;font-size:20px}
.hero p{margin:0;opacity:.92;font-size:15px;max-width:62ch;position:relative}
.page h2 .n{background:var(--pc)}
.tab[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--ti,#0E8C8C)}
/* ===== owner mode ===== */
.obar{display:none;max-width:1080px;margin:0 auto;padding:7px 4px;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font-size:13px;white-space:nowrap}
.obar::-webkit-scrollbar{display:none}
@media (max-width:600px){.obar .sp{display:none}.obar .stt #ostate{display:none}.obar #owho{display:none}.obar{gap:6px}.obar .btn{padding:4px 10px;font-size:12.5px}}
body.owner .obar{display:flex}
body.owner .top{background:linear-gradient(180deg,var(--hdr) 0,var(--hdr) 50%,var(--strip) 50%)}
.obar .who{font-weight:800;color:var(--hfg);display:flex;align-items:center;gap:6px}
.obar .who svg{width:16px;height:16px}
.obar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.obar .dot.dirty{background:var(--warn)}
.obar .stt{color:var(--mute)}
.obar .sp{flex:1}
.obar .btn{padding:4px 12px}
.edp{display:none}
body.owner:not(.preview) .edp{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;border:1px dashed var(--royal);background:var(--card);color:var(--royal);cursor:pointer;vertical-align:middle;margin-inline-start:6px;flex:none;padding:0}
.edp svg{width:14px;height:14px}
.hero .edp{border-color:rgba(255,255,255,.7)!important;background:rgba(255,255,255,.15)!important;color:#fff!important}
body.owner:not(.preview) [data-ed]{outline:1px dashed color-mix(in srgb,var(--royal) 55%,transparent);outline-offset:3px;border-radius:4px}
body.owner:not(.preview) .hero [data-ed]{outline-color:rgba(255,255,255,.55)}
.oadd{display:none}
body.owner:not(.preview) .oadd{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:18px;color:var(--royal);font:700 14px var(--f-display);background:transparent;cursor:pointer;min-height:120px}
.rm .rmact{display:none;gap:6px}
body.owner:not(.preview) .rm .rmact{display:flex}
.pvexit{display:none!important;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));z-index:35}
body.owner.preview .obar{display:none}
body.owner.preview .pvexit{display:inline-flex!important}
.dlg{position:fixed;inset:0;z-index:45;background:rgba(6,15,25,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.dlg .box{width:100%;max-width:460px;background:var(--card);color:var(--ink);border-radius:16px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h3{margin:0;font:800 17px var(--f-display)}
.dlg .row{display:grid;gap:4px}
.dlg textarea,.dlg input[type=text],.dlg input[type=email],.dlg input[type=password],.dlg input[type=tel],.dlg input[type=url]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 15px var(--f-body)}
.dlg textarea{min-height:90px;resize:vertical}
.dlg input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg .msg{font-size:13px;color:var(--bad);font-weight:700;margin:0}
.dlg .info{font-size:13px;color:var(--mute);margin:0}
.dlg .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone{direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:50;background:#14232b;color:#fff;padding:9px 16px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.page .filters button[aria-pressed="true"]{background:var(--pc);border-color:var(--pc)}
.page .ttl-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc2) 16%,transparent);color:var(--pc2);flex:none}
.page .ttl-ic svg{width:19px;height:19px}
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rm{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start;background:var(--card)}
.rm .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--royal)}
.rm .ic svg{width:20px;height:20px}
.rm h3{margin:0;font:800 15px/1.4 var(--f-display)}
.rm p{margin:0;font-size:13px;color:var(--mute)}
.st{justify-self:start;font:700 11px var(--f-body);padding:2px 10px;border-radius:99px}
.st-dev{background:var(--ok-bg);color:var(--ok)}.st-plan{background:var(--chip);color:var(--royal)}.st-idea{background:var(--warn-bg);color:var(--warn)}
.contact{display:grid;gap:10px}
.mailrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mail{direction:ltr;font:700 15px var(--f-body);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 12px;user-select:all;overflow-wrap:anywhere}
.flag{margin-top:10px;font-size:12px}
.flag a{color:var(--mute)}
.footmail{direction:ltr;unicode-bidi:isolate;color:var(--royal);font-weight:700;user-select:all}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}

/* pages */
main{max-width:1080px;margin:0 auto;padding-block:18px 24px}
.page{display:grid;gap:14px}
.page.narrow{max-width:820px;margin:0 auto}
.calc{display:grid;gap:14px;align-items:start}
@media (min-width:900px){.calc{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.calc .resbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px)}}
.col{display:grid;gap:14px;min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{margin:0 0 12px;font:800 17px/1.4 var(--f-display);text-wrap:balance;display:flex;align-items:center;gap:8px}
h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sel);color:#fff;font-size:13px;flex:none}
.lead{margin:-4px 0 12px;color:var(--mute);font-size:14px}

/* welcome */
.welcome{background:linear-gradient(135deg,var(--soft),var(--card));border-color:var(--royal)}
.welcome .wh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.welcome h2{margin-bottom:6px}
.x{border:0;background:transparent;color:var(--mute);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0 12px;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:8px;align-items:flex-start;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sel);color:#fff;font:700 12px var(--f-display);flex:none;margin-top:1px}
.who-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.picker button{text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;font:700 15px/1.35 var(--f-display);display:grid;gap:2px;transition:border-color .15s}
.picker button:hover{border-color:var(--royal)}
.picker button small{font:500 12px var(--f-body);color:var(--mute)}
.picker button[aria-pressed="true"]{background:var(--pc,var(--sel));border-color:var(--pc,var(--sel));color:#fff}
.picker button[aria-pressed="true"] small{color:rgba(255,255,255,.78)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.top button:focus-visible{outline-color:var(--hsel)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.f{min-width:0}
label.l{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}
label.l .req{color:var(--bad)}
input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:700 16px var(--f-body);font-variant-numeric:tabular-nums}
input[type=number]{text-align:center}
input[type=number]::placeholder{color:var(--mute);font-weight:500;opacity:.7}
input.bad{border-color:var(--bad);background:var(--bad-bg)}
.err{margin:4px 0 0;font-size:12px;color:var(--bad);font-weight:700}
.unit{display:flex;gap:6px}.unit input{flex:1;min-width:0}.unit select{width:auto;flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;margin-top:8px}
.chk input{margin-top:5px;width:16px;height:16px;flex:none;accent-color:var(--royal)}
.chk small{display:block;color:var(--mute);font-size:12px}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.block{margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:700 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--royal);color:var(--royal)}
a.btn{text-decoration:none}
.btn.pri{background:var(--sel);border-color:var(--sel);color:#fff}
.btn.pri:hover{filter:brightness(1.15);color:#fff}
.btn svg{width:15px;height:15px}

/* result */
.rtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.rtop h2{margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--mute);font:700 12px var(--f-body);padding:4px 11px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff}
.res-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 12px 3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge svg{width:14px;height:14px;flex:none}

function rangeOf(id){
  if(id==='dlab')return $('dunit').value==='nmol'?[2,1000]:[1,400];
  if(id==='mgv')return $('mgu').value==='mmol'?[0.1,3]:[0.2,6];
  if(id==='b12v')return $('b12u').value==='pmol'?[15,2200]:[20,3000];
  return RANGE[id];
}
function errEl(id){let e=$('e-'+id);if(!e){e=document.createElement('p');e.className='err';e.id='e-'+id;e.hidden=true;const host=$(id).closest('.unit')||$(id);host.after(e)}return e}
function val(id){
  const el=$(id),raw=el.value.trim(),e=errEl(id);
  if(raw===''){el.classList.remove('bad');e.hidden=true;return {s:'empty'}}
  const v=parseFloat(raw),rg=rangeOf(id);
  if(isNaN(v)||(rg&&(v<rg[0]||v>rg[1]))){el.classList.add('bad');e.hidden=false;e.textContent=`${T('e_range')} ${fmt(rg[0])} – ${fmt(rg[1])}`;return {s:'bad'}}
  el.classList.remove('bad');e.hidden=true;return {s:'ok',v};
}
/* returns values or null after rendering the empty/invalid state */
function req(list,opt=[]){
  const out={},missing=[],bad=[];
  [...list,...opt].forEach(id=>{const r=val(id);if(r.s==='ok')out[id]=r.v;else{out[id]=null;if(r.s==='bad')bad.push(id);else if(list.includes(id))missing.push(id)}});
  if(bad.length||missing.length){emptyState(missing,bad);return null}
  return out;
}

      opts:[{h:L('البديل (Cyanocobalamin)','Alternative (cyanocobalamin)'),b:L('1,000 mcg عضلياً يومياً لأسبوع، ثم أسبوعياً لشهر، ثم شهرياً','1,000 mcg IM daily for 1 week, weekly for 1 month, then monthly'),r:[7]}]};
      notes.unshift({t:L('أعراض عصبية مع نقص B12: لا يؤخَّر العلاج.','Neurological symptoms with low B12: do not delay treatment.'),r:[29,5],u:1})}

      pt:L('تحتاج حقن B12 لأن جسمك لا يمتصه جيداً من الطعام: 3 حقن في الأسبوع لمدة أسبوعين، ثم حقنة كل 2 إلى 3 أشهر.','You need B12 injections because your body does not absorb it well: 3 injections a week for 2 weeks, then one every 2–3 months.'),
      plan:[{h:L('التحميل: أسبوعان','Loading: 2 weeks'),d:L('1 ملغ 3 مرات أسبوعياً','1 mg three times a week')},{h:L('الاستمرار','Continue'),d:L('1 ملغ كل 2 – 3 أشهر، غالباً مدى الحياة','1 mg every 2–3 months, usually lifelong')}],

/* ----- generic dialog ----- */
function dialog({title,fields=[],info='',buttons}){
  return new Promise(res=>{
    $('dlg-t').textContent=title;$('dlg-m').hidden=true;
    $('dlg-b').innerHTML=(info?`<p class="info">${esc(info)}</p>`:'')+fields.map((f,i)=>{
      const id='dlgf'+i,lab=`<label class="l" for="${id}">${esc(f.label)}</label>`;
      if(f.type==='textarea')return `<div class="row">${lab}<textarea id="${id}"${f.ph?` placeholder="${esc(f.ph)}"`:''}${f.ltr?' dir="ltr"':''}>${esc(f.value)}</textarea></div>`;
      if(f.type==='checks')return `<div class="row"><label class="l" for="${id}">${esc(f.label)}</label><div class="checks" id="${id}">${f.options.map(o=>`<label class="ck"><input type="checkbox" value="${o[0]}"${f.value.includes(o[0])?' checked':''}><span>${esc(o[1])}</span></label>`).join('')}</div></div>`;
      if(f.type==='select')return `<div class="row">${lab}<select id="${id}">${f.options.map(o=>`<option value="${o[0]}"${o[0]===f.value?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
      if(f.type==='colors')return `<div class="cols"><div class="row"><label class="l" for="${id}a">${esc(f.labels[0])}</label><input type="color" id="${id}a" value="${f.value[0]}"></div><div class="row"><label class="l" for="${id}b">${esc(f.labels[1])}</label><input type="color" id="${id}b" value="${f.value[1]}"></div></div>`;
      return `<div class="row">${lab}<input type="${f.type||'text'}" id="${id}" value="${esc(f.value)}"${f.ph?` placeholder="${esc(f.ph)}"`:''}${['tel','email','url'].includes(f.type)?' dir="ltr"':''}></div>`;
    }).join('');
    $('dlg-a').innerHTML=buttons.map((b,i)=>`<button class="btn${b.pri?' pri':''}" type="${b.pri?'submit':'button'}" data-bi="${i}">${esc(b.label)}</button>`).join('');
    const read=()=>fields.map((f,i)=>f.type==='colors'?[$('dlgf'+i+'a').value,$('dlgf'+i+'b').value]:f.type==='checks'?[...$('dlgf'+i).querySelectorAll('input:checked')].map(x=>+x.value):$('dlgf'+i).value);
    const finish=v=>{$('dlg').hidden=true;$('dlgf').onsubmit=null;$('dlg-a').onclick=null;res(v)};
    $('dlg-a').onclick=e=>{const b=e.target.closest('[data-bi]');if(!b||b.type==='submit')return;finish({action:buttons[+b.dataset.bi].action,values:read()})};
    $('dlgf').onsubmit=e=>{e.preventDefault();const b=buttons.find(x=>x.pri);finish({action:b.action,values:read()})};
    dialog.msg=m=>{$('dlg-m').textContent=m;$('dlg-m').hidden=false};
    $('dlg').hidden=false;const first=$('dlg-b').querySelector('input,textarea,select');(first||$('dlg-a').querySelector('button')).focus();
  });
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dlg').hidden){$('dlg-a').querySelector('[data-bi]:not([type=submit])')?.click()}});

function parseRows(txt){
  const sxMap={};SEXES().forEach(([k,l])=>{sxMap[l.trim()]=k;sxMap[k]=k});Object.assign(sxMap,{'الكل':'all','ذكر':'m','أنثى':'f','انثى':'f','حامل':'p','مرضع':'l','all':'all','male':'m','female':'f','pregnant':'p','lactating':'l'});
  const rows=[];const lines=txt.split('\n').map(x=>x.trim()).filter(Boolean);
  for(const [i,line] of lines.entries()){
    const p=line.split(/[|،]/).map(x=>x.trim());if(p.length<3)return {err:i+1};
    const m=p[0].replace(/\s/g,'').match(/^(\d+(?:\.\d+)?)(?:-(\d+(?:\.\d+)?|\+))?$|^(\d+(?:\.\d+)?)\+$/);if(!m)return {err:i+1};
    let a0,a1;if(m[3]!=null){a0=+m[3];a1=110}else{a0=+m[1];a1=m[2]==null?a0:m[2]==='+'?110:+m[2]}
    const sx=sxMap[(p[1]||'').toLowerCase()]||sxMap[p[1]];if(!sx||a1<a0)return {err:i+1};
    const rda=p[2];const ul=p[3]&&p[3]!=='-'?p[3]:'';if(!rda)return {err:i+1};
    rows.push({a0,a1,sx,rda,ul});
  }
  return rows.length?{rows}:{err:1};
}

let startLang='ar',startPage='calc',welcomeSeen=false;
try{
  const s=localStorage.getItem('vw-k');buildData();if(s&&F[s])K=s;
  startLang=localStorage.getItem('vw-lang')||'ar';startPage=localStorage.getItem('vw-p')||'calc';
  const m=localStorage.getItem('vw-mode');if(m)MODE=m;
  welcomeSeen=!!localStorage.getItem('vw-welcome');
  const th=localStorage.getItem('vw-theme');if(th)document.documentElement.dataset.theme=th;
}catch(e){}
if(PAGES.includes(location.hash.slice(1)))startPage=location.hash.slice(1);
$('welcome').hidden=welcomeSeen;
try{$('rmnew').hidden=localStorage.getItem('vw-rm')==='3'}catch(e){}
document.querySelectorAll('#modeg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
document.querySelectorAll('[data-for]').forEach(el=>{el.hidden=!el.dataset.for.split(' ').includes(K)});
document.querySelectorAll('#picker button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===K));
applyColors();
setLang(startLang);
show(startPage);
loadPublished();
if(location.hash==='#owner')openOwner();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
